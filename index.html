<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tünetnapló</title>
    <style>
      body {
        font:
          15px system-ui,
          sans-serif;
        background: #fff;
        color: #222;
        max-width: 560px;
        margin: auto;
        padding: 16px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 12px;
      }
      legend {
        font-weight: bold;
        margin-bottom: 4px;
      }
      label[for] {
        display: block;
        font-weight: bold;
        margin: 16px 0 4px;
      }
      .chk {
        display: inline-block;
        padding: 8px 12px;
        border: 1px solid #767676;
        border-radius: 16px;
        margin: 4px;
        cursor: pointer;
      }
      .chk:has(input:checked) {
        background: #0e7c66;
        color: #fff;
      }
      .chk:has(input:focus-visible) {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
      }
      .chk input {
        display: inline-block;
        width: auto;
        margin: 0 4px 0 0;
      }
      input,
      textarea {
        display: block;
        width: 100%;
        padding: 8px;
        font: inherit;
        border: 1px solid #767676;
      }
      .hibas {
        border: 2px solid #e74c3c;
      }
      .btn {
        display: inline-block;
        margin-top: 12px;
        background: #0e7c66;
        color: #fff;
        padding: 10px 16px;
        cursor: pointer;
        border: 0;
        font: inherit;
      }
      .btn:focus-visible {
        outline: 3px solid #005fcc;
        outline-offset: 2px;
      }
      #ok {
        color: #2ecc71;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Napi tünetnapló</h1>
    <form id="naplo">
      <fieldset id="tunetek">
        <legend>Tünetek</legend>
        <label class="chk"> <input type="checkbox" name="tunet" value="fejfajas" />Fejfájás</label>
        <label class="chk">
          <input type="checkbox" name="tunet" value="hanyinger" />Hányinger</label
        >
        <label class="chk"> <input type="checkbox" name="tunet" value="szedules" />Szédülés</label>
      </fieldset>
      <label for="eros">Erősség (0–10)</label>
      <input id="eros" type="number" min="0" max="10" />
      <label for="megj">Megjegyzés</label>
      <textarea id="megj"></textarea>
      <button type="submit" class="btn" id="ment">Mentés</button>
    </form>
    <p id="ok"></p>
    <script>
      document.getElementById('naplo').addEventListener('submit', function (e) {
        e.preventDefault();
        var eros = document.getElementById('eros');
        var v = Number(eros.value);
        document.getElementById('ok').textContent = '';
        if (eros.value === '' || v < 0 || v > 10) {
          eros.classList.add('hibas');
          return;
        }
        eros.classList.remove('hibas');
        document.getElementById('ok').textContent = 'Mentve!';
      });
    </script>
  </body>
</html>
